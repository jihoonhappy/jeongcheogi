<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16233A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="정처기 필기">
<title>정보처리기사 필기 트레이너</title>
<style>
:root{
  --paper:#EDF0F4; --grid:#DDE3EA; --card:#FFFFFF;
  --ink:#16233A; --ink2:#4A5B75; --ink3:#8494AB;
  --line:#D5DDE6;
  --blue:#2F5DE0; --blue-soft:#E7EDFD;
  --teal:#0E8074; --teal-soft:#E0F2EF;
  --mag:#C2185B;  --mag-soft:#FBE7EF;
  --amber:#B26A00; --amber-soft:#FDF0DC;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  color:var(--ink); background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  line-height:1.6; -webkit-text-size-adjust:100%;
}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 72px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hide{display:none!important}

/* ── 헤더 ── */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);font-family:var(--mono)}
h1{margin:2px 0 0;font-size:26px;letter-spacing:-.02em;font-weight:800}
h1 em{font-style:normal;color:var(--blue)}
.streak{font-family:var(--mono);font-size:12px;color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}

/* ── 카드 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-family:var(--mono);font-weight:700}

/* ── 계기판 ── */
.gauges{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.g{text-align:center}
.g .ring{position:relative;width:100%;aspect-ratio:1;max-width:76px;margin:0 auto}
.g svg{transform:rotate(-90deg);width:100%;height:100%}
.g .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:700}
.g .lbl{margin-top:6px;font-size:10px;color:var(--ink2);line-height:1.3}
.g .lbl b{display:block;font-family:var(--mono);font-size:11px;color:var(--ink3);font-weight:700}

/* ── 히트맵 ── */
.heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.hcol{display:flex;flex-direction:column;gap:3px}
.hc{width:11px;height:11px;border-radius:2px;background:#E3E8EE}
.hc.l1{background:#C3D3F6}.hc.l2{background:#8FAEF0}.hc.l3{background:#5C86E8}.hc.l4{background:#2F5DE0}
.heat-legend{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--ink3);font-family:var(--mono)}

/* ── 버튼 ── */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px}
.mode{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px;transition:.12s}
.mode:hover{border-color:var(--blue);transform:translateY(-1px)}
.mode:disabled{opacity:.4;cursor:default;transform:none;border-color:var(--line)}
.mode .mt{font-weight:700;font-size:15px;display:flex;align-items:center;gap:7px}
.mode .md{font-size:12px;color:var(--ink2);margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-blue{background:var(--blue)}.d-teal{background:var(--teal)}.d-mag{background:var(--mag)}.d-amber{background:var(--amber)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;color:var(--ink2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chip small{font-family:var(--mono);opacity:.6;margin-left:5px}

.btn{border-radius:9px;padding:11px 20px;font-weight:700;font-size:14px;border:1px solid transparent}
.btn-primary{background:var(--blue);color:#fff}
.btn-ghost{border-color:var(--line);background:var(--card);color:var(--ink2)}
.btn-mag{border-color:var(--mag);background:var(--mag-soft);color:var(--mag)}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}

/* ── 문제 ── */
.progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:10px 0 16px}
.progress i{display:block;height:100%;background:var(--blue);transition:width .25s}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;letter-spacing:.05em}
.tag{padding:3px 8px;border-radius:5px;background:var(--blue-soft);color:var(--blue);font-weight:700}
.tag.t2{background:var(--amber-soft);color:var(--amber)}
.tag.t3{background:var(--mag-soft);color:var(--mag)}
.tag.t4{background:var(--teal-soft);color:var(--teal)}
.qtext{font-size:17px;font-weight:700;line-height:1.65;margin:14px 0 4px;white-space:pre-wrap}
.qtext code,pre.code{font-family:var(--mono)}
/* 코드·트리·표가 들어간 지문은 고정폭 글꼴로 — 비례폭이면 자릿수가 어긋나 읽을 수 없습니다. */
.qtext.mono,.rev .rq.mono{font-family:var(--mono);font-size:14.5px;font-weight:600;line-height:1.55;overflow-x:auto}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:11px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#FCFDFE;border-radius:9px;padding:12px 13px;font-size:14.5px;line-height:1.55;transition:.1s;width:100%}
.opt:hover{border-color:var(--blue)}
.opt .n{font-family:var(--mono);font-weight:700;color:var(--ink3);flex:none}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--teal);background:var(--teal-soft)}
.opt.ok .n{color:var(--teal)}
.opt.no{border-color:var(--mag);background:var(--mag-soft)}
.opt.no .n{color:var(--mag)}
.opt.dis{cursor:default}
.expl{margin-top:14px;border-left:3px solid var(--teal);background:var(--teal-soft);border-radius:0 9px 9px 0;padding:12px 14px;font-size:14px}
.expl.bad{border-left-color:var(--mag);background:var(--mag-soft)}
.expl .vd{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.expl.bad .vd{color:var(--mag)}
.expl p{margin:6px 0 0;color:var(--ink)}
.expl .srs{margin-top:8px;font-size:11.5px;color:var(--ink2);font-family:var(--mono)}

/* ── 듣기 모드 ── 화면을 보지 않아도 되도록 조작부를 크게 잡습니다. */
.lscard{text-align:center;padding:26px 18px 22px}
.lsphase{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:700}
.lspos{font-family:var(--mono);font-size:34px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.lsbig{width:132px;height:132px;border-radius:66px;border:2px solid var(--line);background:#FCFDFE;
  font-size:40px;line-height:1;color:var(--ink2);cursor:pointer;transition:.12s;display:inline-flex;align-items:center;justify-content:center}
.lsbig.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.lsbig.mic{border-color:var(--mag);background:var(--mag-soft);color:var(--mag);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.lsphase.mic{color:var(--mag)}
.lsscore{margin-top:6px;font-family:var(--mono);font-size:12.5px;color:var(--ink2)}
.lsheard{margin-top:12px;font-size:13px;color:var(--ink2)}
.lsbig:active{transform:scale(.96)}
.lsrow{display:flex;gap:8px;justify-content:center;margin-top:18px}
.lsbtn{flex:1;max-width:130px;padding:14px 8px;font-size:14px}
.lsmeta{margin-top:20px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;color:var(--ink3)}
.lsq{margin-top:8px;font-size:14.5px;line-height:1.6;color:var(--ink2);text-align:left;white-space:pre-wrap}

/* ── 결과/통계 ── */
.score{display:flex;align-items:flex-end;gap:12px}
.score b{font-size:56px;line-height:.95;font-family:var(--mono);letter-spacing:-.03em}
.score span{padding-bottom:8px;font-size:13px;color:var(--ink2)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:3px}
.sline{display:flex;justify-content:space-between;font-size:13.5px;margin-top:12px}
.sline .f{font-family:var(--mono);font-weight:700}
.rev{border:1px solid var(--line);border-radius:10px;padding:13px;margin-top:10px}
.rev .rq{font-weight:700;font-size:14.5px;margin:7px 0;white-space:pre-wrap}
.rev .ra{font-size:13.5px;color:var(--teal);font-weight:600}
.rev .rw{font-size:13.5px;color:var(--mag)}
.rev .re{font-size:13px;color:var(--ink2);margin-top:7px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.empty{color:var(--ink3);font-size:13.5px;padding:8px 0}
.timer{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--ink2)}
.timer.warn{color:var(--mag)}
textarea{width:100%;min-height:88px;font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;background:#FCFDFE;color:var(--ink)}
.note{font-size:12px;color:var(--ink3);margin-top:8px;line-height:1.6}
.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--paper) 26%);padding-top:16px;margin-top:16px}
@media(max-width:520px){
  h1{font-size:22px} .score b{font-size:46px}
  .gauges{grid-template-columns:repeat(5,1fr);gap:4px}
  .g .lbl{font-size:9px}
}
</style>
</head>

<script>
/* ═══════════════ 저장소 (localStorage → window.storage → 메모리) ═══════════════ */
const KEY = "jbg_trainer_v1";
const Store = (() => {
  let mem = null, kind = "memory";
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); kind = "local"; } catch(e){}
  return {
    kind,
    async load(){
      if (kind === "local") { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
      if (window.storage) { try { const r = await window.storage.get(KEY); return r && r.value ? JSON.parse(r.value) : null; } catch(e){ return mem; } }
      return mem;
    },
    async save(d){
      const s = JSON.stringify(d);
      if (kind === "local") { try { localStorage.setItem(KEY, s); return; } catch(e){} }
      if (window.storage) { try { await window.storage.set(KEY, s); return; } catch(e){} }
      mem = d;
    }
  };
})();

/* ═══════════════ 상태 ═══════════════ */
const SUBJ = {1:"소프트웨어 설계",2:"소프트웨어 개발",3:"데이터베이스 구축",4:"프로그래밍 언어 활용",5:"정보시스템 구축관리"};

   "과목-주요항목-세부항목" 형식이며 통계 화면의 '출제기준 영역별 진단'에 사용됩니다. */
const KMAP = {
  "1-1-1":["요구사항 확인","현행 시스템 분석"],        "1-1-2":["요구사항 확인","요구사항 확인"],
  "1-1-3":["요구사항 확인","분석모델 확인"],          "1-2-1":["화면 설계","UI 요구사항 확인"],
  "1-2-2":["화면 설계","UI 설계"],                    "1-3-1":["애플리케이션 설계","공통 모듈 설계"],
  "1-3-2":["애플리케이션 설계","객체지향 설계"],      "1-4-1":["인터페이스 설계","인터페이스 요구사항 확인"],
  "1-4-2":["인터페이스 설계","인터페이스 대상 식별"], "1-4-3":["인터페이스 설계","인터페이스 상세 설계"],
  "2-1-1":["데이터 입출력 구현","자료구조"],          "2-1-2":["데이터 입출력 구현","데이터 조작 프로시저 작성"],
  "2-1-3":["데이터 입출력 구현","데이터 조작 프로시저 최적화"], "2-2-1":["통합 구현","모듈 구현"],
  "2-2-2":["통합 구현","통합 구현 관리"],             "2-3-1":["제품소프트웨어 패키징","패키징"],
  "2-3-2":["제품소프트웨어 패키징","매뉴얼 작성"],    "2-3-3":["제품소프트웨어 패키징","버전관리"],
  "2-4-1":["애플리케이션 테스트 관리","테스트케이스 설계"], "2-4-2":["애플리케이션 테스트 관리","통합 테스트"],
  "2-4-3":["애플리케이션 테스트 관리","성능 개선"],   "2-5-1":["인터페이스 구현","설계 확인"],
  "2-5-2":["인터페이스 구현","기능 구현"],            "2-5-3":["인터페이스 구현","구현 검증"],
  "3-1-1":["SQL 응용","절차형 SQL 작성"],             "3-1-2":["SQL 응용","응용 SQL 작성"],
  "3-2-1":["SQL 활용","기본 SQL 작성"],               "3-2-2":["SQL 활용","고급 SQL 작성"],
  "3-3-1":["논리 데이터베이스 설계","관계데이터베이스 모델"], "3-3-2":["논리 데이터베이스 설계","데이터모델링 및 설계"],
  "3-4-1":["물리 데이터베이스 설계","물리요소 조사 분석"],    "3-4-2":["물리 데이터베이스 설계","물리속성 설계"],
  "3-4-3":["물리 데이터베이스 설계","물리 데이터베이스 모델링"], "3-4-4":["물리 데이터베이스 설계","반정규화"],
  "3-4-5":["물리 데이터베이스 설계","물리데이터 모델 품질검토"], "3-5-1":["데이터 전환","전환 기술"],
  "3-5-2":["데이터 전환","전환 수행"],                "3-5-3":["데이터 전환","데이터 정제"],
  "4-1-1":["서버프로그램 구현","개발환경 구축"],      "4-1-2":["서버프로그램 구현","서버 프로그램 구현"],
  "4-1-3":["서버프로그램 구현","배치 프로그램 구현"], "4-2-1":["프로그래밍 언어 활용","기본문법 활용"],
  "4-2-2":["프로그래밍 언어 활용","언어특성 활용"],   "4-2-3":["프로그래밍 언어 활용","라이브러리 활용"],
  "4-3-1":["응용 SW 기초 기술 활용","운영체제 기초 활용"], "4-3-2":["응용 SW 기초 기술 활용","네트워크 기초 활용"],
  "4-3-3":["응용 SW 기초 기술 활용","기본 개발환경 구축"],
  "5-1-1":["소프트웨어개발 방법론 활용","방법론 선정"],       "5-1-2":["소프트웨어개발 방법론 활용","방법론 테일러링"],
  "5-2-1":["IT프로젝트 정보시스템 구축관리","네트워크 구축 관리"], "5-2-2":["IT프로젝트 정보시스템 구축관리","SW 구축 관리"],
  "5-2-3":["IT프로젝트 정보시스템 구축관리","HW 구축 관리"],  "5-2-4":["IT프로젝트 정보시스템 구축관리","DB 구축 관리"],
  "5-3-1":["소프트웨어 개발 보안 구축","SW개발 보안 설계"],   "5-3-2":["소프트웨어 개발 보안 구축","SW개발 보안 구현"],
  "5-4-1":["시스템 보안 구축","시스템 보안 설계"],            "5-4-2":["시스템 보안 구축","시스템 보안 구현"]
};
const INTERVAL = [0,1,2,4,8,16];           // Leitner 박스별 다음 복습까지 일수
const BANK = window.QUESTIONS || [];
const byId = Object.fromEntries(BANK.map(q => [q.id, q]));

let DB = { v:1, stats:{}, days:{}, sessions:[] };
let view = "home";
let sess = null;          // {mode,queue,i,ans:{},startedAt,limitSec,label}
let pickSubj = [1,2,3,4,5];
let pickCount = 20;
let tick = null;

const todayKey = (d = new Date()) => {
  const t = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return t.toISOString().slice(0,10);
};
const addDays = (k, n) => { const d = new Date(k + "T00:00:00"); d.setDate(d.getDate()+n); return todayKey(d); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const stat = id => DB.stats[id] || (DB.stats[id] = { seen:0, right:0, wrong:0, box:0, due:todayKey(), last:null });
/* 지문에 코드·ASCII 트리·표가 들어 있으면 고정폭으로 렌더해야 합니다.
   판별: 줄바꿈이 있고, 들여쓰기(연속 공백 2칸 이상)나 코드 기호가 보이는 경우. */
const isMono = s => /\n/.test(s) && (/\n\s{2,}\S/.test(s) || /[{};]|\bSELECT\b|\bprintf\b|\bdef\b|\bint\b/.test(s));

/* ═══════════════ 파생 지표 ═══════════════ */
function dueList(){
  const t = todayKey();
  return BANK.filter(q => { const s = DB.stats[q.id]; return s && s.seen > 0 && s.due <= t; });
}
/* 약점 = 틀렸거나, 찍어서 맞혔거나, 모르겠다고 표시한 문항.
   확신 정답률이 낮은 순으로 정렬합니다. */
function weakList(){
  const risk = s => (s.wrong||0) + (s.lucky||0) + (s.unsure||0);
  return BANK.filter(q => { const s = DB.stats[q.id]; return s && s.seen >= 1 && risk(s) > 0; })
    .sort((a,b) => {
      const A = DB.stats[a.id], B = DB.stats[b.id];
      return (A.right/A.seen - B.right/B.seen) || (risk(B) - risk(A));
    });
}
function subjMastery(s){
  const qs = BANK.filter(q => q.s === s);
  let seen = 0, score = 0;
  qs.forEach(q => { const st = DB.stats[q.id]; if (st && st.seen) { seen++; score += Math.min(st.box,5)/5; } });
  return { pct: qs.length ? Math.round(score/qs.length*100) : 0, seen, total: qs.length };
}
function streakDays(){
  let n = 0, k = todayKey();
  if (!DB.days[k]) k = addDays(k,-1);
  while (DB.days[k] && DB.days[k].solved > 0) { n++; k = addDays(k,-1); }
  return n;
}
const totalSolved = () => Object.values(DB.days).reduce((a,d) => a + d.solved, 0);
const totalCorrect = () => Object.values(DB.days).reduce((a,d) => a + d.correct, 0);
const totalSolid = () => Object.values(DB.days).reduce((a,d) => a + (d.solid||0), 0);

/* ═══════════════ 세션 ═══════════════ */
function start(mode){
  let queue = [], label = "", limitSec = 0;
  if (mode === "mock"){
    for (let s=1;s<=5;s++) queue = queue.concat(shuffle(BANK.filter(q=>q.s===s)).slice(0,20));
    label = "실전 모의고사"; limitSec = 150*60;
  } else if (mode === "review"){
    queue = shuffle(dueList()).slice(0,40); label = "오늘의 복습";
  } else if (mode === "weak"){
    queue = weakList().slice(0, Math.min(30, weakList().length)); label = "약점 집중";
  } else if (mode === "freq"){
    queue = shuffle(BANK.filter(q => q.f === "A" && pickSubj.includes(q.s))).slice(0, pickCount); label = "고빈도 집중";
  } else {
    queue = shuffle(BANK.filter(q => pickSubj.includes(q.s))).slice(0, pickCount); label = "과목 학습";
  }
  if (!queue.length) return;
  // 보기 순서를 매번 섞어 정답 위치를 외우는 것을 막습니다. o[표시위치] = 원본 보기 번호
  queue = queue.map(q => Object.assign({}, q, { o: shuffle([0,1,2,3]) }));
  // mark[문항id] = "guess"(찍음) | "unsure"(모르겠음). 없으면 확신 있는 응답.
  sess = { mode, queue, i:0, ans:{}, mark:{}, startedAt:Date.now(), limitSec, label, revealed:false };
  view = "quiz"; render();
  if (limitSec) { clearInterval(tick); tick = setInterval(() => { const el = document.getElementById("timer"); if(!el||!sess) return; const left = tickLeft(); if (left <= 0) { clearInterval(tick); grade(); } else paintTimer(el, left); }, 1000); }
}
const tickLeft = () => sess.limitSec - Math.floor((Date.now()-sess.startedAt)/1000);
function paintTimer(el, left){
  const m = String(Math.floor(left/60)).padStart(2,"0"), s = String(left%60).padStart(2,"0");
  el.textContent = m + ":" + s; el.className = "timer" + (left < 600 ? " warn" : "");
}

function answer(pos){
  const q = sess.queue[sess.i];
  if (sess.mode !== "mock" && sess.revealed) return;
  const ci = q.o[pos];               // 표시 위치 → 원본 보기 번호
  sess.ans[q.id] = ci;
  if (sess.mode !== "mock") { sess.revealed = true; applySRS(q, ci === q.a, sess.mark[q.id]); save(); }
  render();
}

/* 모르겠음 — 답을 고르지 않고 해설을 봅니다. 정답 처리되지 않습니다. */
function unsure(){
  const q = sess.queue[sess.i];
  if (sess.mode === "mock"){ toggleGuess(); return; }
  if (sess.revealed) return;
  sess.ans[q.id] = -1;
  sess.mark[q.id] = "unsure";
  sess.revealed = true;
  applySRS(q, false, "unsure");
  save(); render();
}

/* 시험 모드에서 '찍음' 표시를 켜고 끕니다. */
function toggleGuess(){
  const q = sess.queue[sess.i];
  if (sess.mark[q.id] === "guess") delete sess.mark[q.id];
  else sess.mark[q.id] = "guess";
  render();
}

/* 맞힌 뒤 스스로 '사실 찍었다'고 정정하는 경우 — 기록을 되돌립니다. */
function admitGuess(){
  const q = sess.queue[sess.i];
  if (sess.mark[q.id]) return;
  sess.mark[q.id] = "guess";
  const st = stat(q.id);
  st.right = Math.max(0, st.right - 1);
  st.lucky = (st.lucky || 0) + 1;
  st.box = 1; st.due = todayKey();
  save(); render();
}

/* 확신 있는 정답만 복습 간격이 늘어납니다.
   찍어서 맞힌 것과 모르겠음은 오답과 동일하게 내일 다시 나옵니다. */
function applySRS(q, ok, mark){
  const st = stat(q.id);
  st.seen++; st.last = todayKey();
  if (mark === "unsure"){
    st.unsure = (st.unsure || 0) + 1; st.box = 1; st.due = todayKey();
  } else if (ok && mark === "guess"){
    st.lucky = (st.lucky || 0) + 1;  st.box = 1; st.due = todayKey();
  } else if (ok){
    st.right++; st.box = Math.min(5, st.box + 1); st.due = addDays(todayKey(), INTERVAL[st.box]);
  } else {
    st.wrong++; st.box = 1; st.due = todayKey();
  }
}
function next(){
  if (sess.i + 1 < sess.queue.length){ sess.i++; sess.revealed = false; render(); }
  else grade();
}
function grade(){
  clearInterval(tick);
  if (sess.mode === "mock") sess.queue.forEach(q => applySRS(q, sess.ans[q.id] === q.a, sess.mark[q.id]));
  const k = todayKey();
  const d = DB.days[k] || (DB.days[k] = { solved:0, correct:0, solid:0, sec:0 });
  if (d.solid === undefined) d.solid = 0;
  const right = sess.queue.filter(q => sess.ans[q.id] === q.a).length;
  const solid = sess.queue.filter(q => sess.ans[q.id] === q.a && !sess.mark[q.id]).length;
  d.solved += sess.queue.length; d.correct += right; d.solid += solid;
  d.sec += Math.floor((Date.now() - sess.startedAt)/1000);
  DB.sessions.unshift({ date:k, mode:sess.label, total:sess.queue.length, correct:right, solid:solid });
  DB.sessions = DB.sessions.slice(0,40);
  save(); view = "result"; render();
}
const save = () => Store.save(DB);

const ABBR_KEYS = Object.keys(ABBR).sort((a,b) => b.length - a.length);
const esc4re = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const ABBR_RE = new RegExp("(?<![A-Za-z0-9가-힣])(" + ABBR_KEYS.map(esc4re).join("|") + ")(?![A-Za-z0-9])", "g");

/* 숫자를 한자어 읽기로 바꿉니다. 1→일, 2→이, 37→삼십칠.
   "1번"을 그대로 읽히면 음성 엔진이 "한 번"(횟수)으로 읽어 버리기 때문입니다. */
const SINO = "영일이삼사오육칠팔구";
function sino(n){
  n = parseInt(n, 10);
  if (!n) return "영";
  let out = "";
  if (n >= 100){ const h = Math.floor(n/100); out += (h===1?"":SINO[h]) + "백"; n %= 100; }
  if (n >= 10){ const t = Math.floor(n/10); out += (t===1?"":SINO[t]) + "십"; n %= 10; }
  if (n) out += SINO[n];
  return out;
}
const beon = n => sino(n) + "번";

/* 낭독용 텍스트 정리 — 화면용 기호는 귀에 들리지 않으므로 말로 바꿉니다. */
function sayText(s){
  let t = String(s);
  t = t.replace(/V\(G\)/g, "브이지");
  // 한글 뒤 괄호 안이 영문뿐이면 통째로 뺍니다. "공동 코드 소유(Collective Ownership)" → "공동 코드 소유"
  t = t.replace(/\(([^()]*)\)/g, (m, inner) =>
        /^[A-Za-z0-9 .,'’\/&+\-_]+$/.test(inner) ? "" : " " + inner + " ");
  t = t.replace(/[→⇒]/g, ", 그다음 ").replace(/↔/g, ", 그리고 ");
  t = t.replace(/&/g, " 앤 ").replace(/×/g, " 곱하기 ").replace(/÷/g, " 나누기 ");
  t = t.replace(/[①②③④]/g, m => " " + beon("①②③④".indexOf(m) + 1) + " ");
  t = t.replace(/\n+/g, ". ");
  t = t.replace(ABBR_RE, m => ABBR[m] || m);
  // 숫자 + 번/과목은 한자어로 읽어야 합니다 (1번 → "한 번"(X) / "일번"(O))
  t = t.replace(/(?<![0-9.])(\d{1,3})번(?!\d)/g, (m, d) => beon(d));
  t = t.replace(/(?<![0-9.])([1-5])과목/g, (m, d) => sino(d) + "과목");
  t = t.replace(/([가-힣])\s*-\s*(?=[가-힣])/g, "$1, ");
  t = t.replace(/·/g, ", ").replace(/[~∼]/g, " 에서 ");
  t = t.replace(/[\[\]"']/g, " ").replace(/\s{2,}/g, " ").replace(/\s+([.,])/g, "$1");
  return t.trim();
}

function koVoices(){ return TTS ? (TTS.getVoices() || []).filter(v => (v.lang||"").toLowerCase().startsWith("ko")) : []; }
/* 기기에 설치된 한국어 음성 중 가장 자연스러운 것을 고릅니다.
   Google · Siri 계열 > 그 외 순으로 우선합니다. */
function pickVoice(){
  const saved = (DB.pref && DB.pref.voice) || "";
  const vs = koVoices();
  if (!vs.length) return null;
  const female = /Yuna|유나|Sora|Nara|SunHi|Heami|JiMin|SeoHyeon|YuJin|여성|Female/i;
  return vs.find(v => v.name === saved)
      || vs.find(v => /Google/i.test(v.name) && female.test(v.name))
      || vs.find(v => female.test(v.name))
      || vs.find(v => /Google/i.test(v.name))
      || vs[0];
}
if (TTS && TTS.addEventListener) TTS.addEventListener("voiceschanged", () => {
  LS.voice = pickVoice(); if (view === "listen") paintVoices();
});

/* 긴 문장은 중간에 잘리는 브라우저가 있어 문장 단위로 쪼개 읽습니다. */
function chunk(text, max = 170){
  const out = []; let buf = "";
  String(text).split(/(?<=[.?!])\s+/).forEach(p => {
    while (p.length > max){ if (buf){ out.push(buf.trim()); buf = ""; } out.push(p.slice(0, max)); p = p.slice(max); }
    if ((buf + " " + p).trim().length > max){ out.push(buf.trim()); buf = p; } else buf += " " + p;
  });
  if (buf.trim()) out.push(buf.trim());
  return out.filter(Boolean);
}

/* 한 문항의 낭독 순서. t가 함수면 그 시점에 문장을 만듭니다(정답 확인처럼 결과에 따라 달라지는 것). */
function buildSteps(q, n, total){
  const st = [];
  st.push({ t: `${beon(n)} 문제.`, after: 0.35 });
  st.push({ t: sayText(q.q), after: 0.45 });
  q.c.forEach((c, i) => st.push({ t: `${beon(i+1)}, ${sayText(c)}`, after: 0.3 }));
  if (LS.talk){
    st.push({ t: "정답을 말씀해 주세요.", after: 0.15, ask: true });
    st.push({ t: () => judgeLine(q), after: 0.5, answer: true });
  } else {
    st.push({ t: "정답을 생각해 보세요.", after: LS.gap, think: true });
    st.push({ t: `정답은 ${beon(q.a + 1)}, ${sayText(q.c[q.a])}.`, after: 0.5, answer: true });
  }
  st.push({ t: `해설. ${sayText(q.e)}`, after: 1.0 });
  return st;
}

/* 말한 내용을 채점하고, 읽어 줄 문장을 만듭니다. 동시에 학습 기록에 반영합니다. */
function judgeLine(q){
  const ans = q.a + 1;
  if (LS.said === "unsure"){
    LS.unsure++; applySRS(q, false, "unsure"); save();
    return `모르겠다고 하셨습니다. 정답은 ${beon(ans)}, ${sayText(q.c[q.a])}.`;
  }
  if (!LS.said){
    LS.unsure++; applySRS(q, false, "unsure"); save();
    return `답을 듣지 못했습니다. 정답은 ${beon(ans)}, ${sayText(q.c[q.a])}.`;
  }
  const ok = LS.said === ans;
  if (ok){ LS.right++; applySRS(q, true); } else { LS.wrong++; applySRS(q, false); }
  save();
  return ok ? `${beon(LS.said)}, 정답입니다.`
            : `${beon(LS.said)}이라고 하셨습니다. 정답은 ${beon(ans)}, ${sayText(q.c[q.a])}.`;
}

function listenStart(mode, talk){
  if (!TTS){ alert("이 브라우저는 음성 읽기를 지원하지 않습니다. Chrome 또는 Safari에서 열어 주세요."); return; }
  if (talk && !SRec){ alert("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 또는 Safari에서 열어 주세요."); return; }
  LS.talk = !!talk;
  let pool = [];
  if (mode === "review") pool = shuffle(dueList());
  else if (mode === "weak") pool = weakList();
  else if (mode === "freq") pool = shuffle(BANK.filter(q => q.f === "A" && pickSubj.includes(q.s)));
  else pool = shuffle(BANK.filter(q => pickSubj.includes(q.s)));

  // 코드·트리·표 문항은 귀로 들어서는 이해할 수 없으므로 제외합니다.
  const before = pool.length;
  pool = pool.filter(q => !isMono(q.q));
  LS.skipped = before - pool.length;

  const limit = (mode === "review" || mode === "weak") ? pool.length : pickCount;
  LS.queue = pool.slice(0, limit);
  if (!LS.queue.length){ alert("읽을 문항이 없습니다. 과목이나 범위를 바꿔 보세요."); return; }
  Object.assign(LS, { i:0, step:0, right:0, wrong:0, unsure:0, done:false, said:null, heard:"", startedAt:Date.now() });
  if (DB.pref){ LS.rate = DB.pref.rate || LS.rate; LS.gap = DB.pref.gap || LS.gap; }
  LS.voice = pickVoice();
  LS.steps = buildSteps(LS.queue[0], 1, LS.queue.length);
  view = "listen"; render();
  listenPlay();
}

async function keepScreenOn(on){
  try {
    if (on && "wakeLock" in navigator && !LS.wake) LS.wake = await navigator.wakeLock.request("screen");
    else if (!on && LS.wake){ await LS.wake.release(); LS.wake = null; }
  } catch(e){}
}

function listenPlay(){
  if (!TTS || LS.playing || LS.done) return;
  LS.playing = true;
  keepScreenOn(true);
  // 일부 브라우저가 15초쯤에서 낭독을 멈추는 문제를 우회합니다.
  clearInterval(LS.keepAlive);
  LS.keepAlive = setInterval(() => { if (LS.playing && TTS.speaking && !TTS.paused){ TTS.pause(); TTS.resume(); } }, 8000);
  paintListen();
  speakStep();
}

function listenPause(){
  LS.playing = false;
  clearTimeout(LS.timer); clearInterval(LS.keepAlive);
  stopMic();
  try { TTS.cancel(); } catch(e){}
  keepScreenOn(false);
  paintListen();
}
function listenToggle(){ LS.playing ? listenPause() : listenPlay(); }

function speakStep(){
  if (!LS.playing) return;
  const s = LS.steps[LS.step];
  if (!s){ listenNext(true); return; }
  paintListen();
  const text = typeof s.t === "function" ? s.t() : s.t;
  const parts = chunk(text);
  let k = 0;
  const speakPart = () => {
    if (!LS.playing) return;
    if (k >= parts.length){
      if (s.ask){ LS.timer = setTimeout(startMic, 250); return; }   // 다 읽은 뒤 마이크를 켭니다
      LS.timer = setTimeout(() => { if (!LS.playing) return; LS.step++; speakStep(); }, (s.after || 0) * 1000);
      return;
    }
    const u = new SpeechSynthesisUtterance(parts[k++]);
    u.lang = "ko-KR"; u.rate = LS.rate; u.pitch = 1;
    if (LS.voice) u.voice = LS.voice;
    u.onend = speakPart; u.onerror = speakPart;
    TTS.speak(u);
  };
  speakPart();
}

/* ── 마이크 (음성 인식) ── */
const NUM_PAT = [
  [1, /(^|[^0-9])1([^0-9]|$)|일번|１|하나|한번째|첫번째|첫째|^일$/],
  [2, /(^|[^0-9])2([^0-9]|$)|이번|２|둘|두번째|둘째|^이$/],
  [3, /(^|[^0-9])3([^0-9]|$)|삼번|３|셋|세번째|셋째|^삼$/],
  [4, /(^|[^0-9])4([^0-9]|$)|사번|４|넷|네번째|넷째|^사$/]
];
function parseSaid(raw){
  const t = String(raw).replace(/\s+/g, "");
  if (/모르|몰라|패스|넘겨|글쎄/.test(t)) return "unsure";
  if (/그만|정지|중지|멈춰/.test(t)) return "stop";
  if (/다시|한번더/.test(t)) return "again";
  if (/다음/.test(t)) return "next";
  for (const [n, re] of NUM_PAT) if (re.test(t)) return n;
  return null;
}

function stopMic(){
  LS.listening = false;
  clearTimeout(LS.micTimer);
  if (LS.rec){ try { LS.rec.onend = null; LS.rec.abort(); } catch(e){} LS.rec = null; }
}

function startMic(){
  if (!LS.playing || !SRec){ LS.said = null; LS.step++; speakStep(); return; }
  stopMic();
  LS.said = null; LS.heard = ""; LS.listening = true; paintListen();
  const r = new SRec();
  LS.rec = r;
  r.lang = "ko-KR"; r.interimResults = false; r.maxAlternatives = 4; r.continuous = false;
  let settled = false;
  const finish = (val, heard) => {
    if (settled) return; settled = true;
    clearTimeout(LS.micTimer);
    LS.listening = false; LS.heard = heard || ""; LS.said = val;
    try { r.onend = null; r.stop(); } catch(e){}
    LS.rec = null;
    if (val === "stop"){ listenPause(); return; }
    if (val === "next"){ listenNext(); return; }
    if (val === "again"){ listenAgain(); return; }
    if (val === null && LS.tries < 1){   // 한 번은 다시 물어봅니다
      LS.tries++;
      const u = new SpeechSynthesisUtterance("잘 못 들었습니다. 번호를 다시 말씀해 주세요.");
      u.lang = "ko-KR"; u.rate = LS.rate; if (LS.voice) u.voice = LS.voice;
      u.onend = () => setTimeout(startMic, 200); u.onerror = u.onend;
      TTS.speak(u); return;
    }
    LS.tries = 0;
    LS.step++; speakStep();
  };
  r.onresult = e => {
    let val = null, heard = "";
    for (let i = 0; i < e.results[0].length && val === null; i++){
      heard = e.results[0][i].transcript;
      val = parseSaid(heard);
    }
    finish(val, heard);
  };
  r.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed"){
      LS.micDenied = true; LS.talk = false;
      finish(null, "");
      return;
    }
    finish(null, "");
  };
  r.onend = () => { if (!settled) finish(null, ""); };
  try { r.start(); } catch(e){ finish(null, ""); }
  LS.micTimer = setTimeout(() => finish(null, ""), 9000);   // 9초 안에 말이 없으면 넘어갑니다
}

function listenNext(auto){
  clearTimeout(LS.timer); stopMic();
  try { TTS.cancel(); } catch(e){}
  LS.tries = 0;
  if (LS.i + 1 >= LS.queue.length){ listenFinish(); return; }
  LS.i++; LS.step = 0; LS.said = null; LS.heard = "";
  LS.steps = buildSteps(LS.queue[LS.i], LS.i + 1, LS.queue.length);
  if (!auto && !LS.playing){ paintListen(); return; }
  LS.playing = true; speakStep();
}

function listenPrev(){
  clearTimeout(LS.timer); stopMic();
  try { TTS.cancel(); } catch(e){}
  LS.i = Math.max(0, LS.i - 1); LS.step = 0; LS.done = false; LS.said = null; LS.tries = 0;
  LS.steps = buildSteps(LS.queue[LS.i], LS.i + 1, LS.queue.length);
  if (LS.playing) speakStep(); else paintListen();
}

function listenAgain(){
  clearTimeout(LS.timer); stopMic();
  try { TTS.cancel(); } catch(e){}
  LS.step = 0; LS.done = false; LS.said = null; LS.tries = 0;
  if (LS.playing) speakStep(); else paintListen();
}

function listenFinish(){
  LS.playing = false; LS.done = true;
  clearInterval(LS.keepAlive); stopMic(); keepScreenOn(false);
  let line = `${LS.queue.length}문항을 모두 들었습니다.`;
  if (LS.talk){
    const solved = LS.right + LS.wrong + LS.unsure;
    const pct = solved ? Math.round(LS.right / solved * 100) : 0;
    line += ` 맞힌 문항 ${LS.right}개, 틀린 문항 ${LS.wrong}개, 모르겠음 ${LS.unsure}개. 정답률 ${pct}퍼센트입니다.`;
    const k = todayKey();
    const d = DB.days[k] || (DB.days[k] = { solved:0, correct:0, solid:0, sec:0 });
    if (d.solid === undefined) d.solid = 0;
    d.solved += solved; d.correct += LS.right; d.solid += LS.right;
    d.sec += Math.floor((Date.now() - LS.startedAt) / 1000);
    DB.sessions.unshift({ date:k, mode:"듣고 말하기", total:solved, correct:LS.right, solid:LS.right });
    DB.sessions = DB.sessions.slice(0, 40);
    save();
  }
  line += " 수고하셨습니다.";
  paintListen();
  const u = new SpeechSynthesisUtterance(line);
  u.lang = "ko-KR"; u.rate = LS.rate; if (LS.voice) u.voice = LS.voice;
  try { TTS.speak(u); } catch(e){}
}

function listenExit(){ listenPause(); LS.done = false; view = "home"; render(); }

function prefSet(k, v){ DB.pref = DB.pref || {}; DB.pref[k] = v; save(); }
function setRate(r){ LS.rate = r; prefSet("rate", r); if (LS.playing){ try{TTS.cancel();}catch(e){} speakStep(); } else paintListen(); }
function setGap(g){ LS.gap = g; prefSet("gap", g); LS.steps = buildSteps(LS.queue[LS.i], LS.i+1, LS.queue.length); paintListen(); }
function setVoice(name){
  const v = koVoices().find(x => x.name === name);
  LS.voice = v || LS.voice; prefSet("voice", name);
  paintVoices();
  const u = new SpeechSynthesisUtterance("이 목소리로 읽어 드립니다. 일번, 이번, 삼번, 사번.");
  u.lang = "ko-KR"; u.rate = LS.rate; if (LS.voice) u.voice = LS.voice;
  try { TTS.cancel(); TTS.speak(u); } catch(e){}
}
function setTalk(on){
  if (on && !SRec){ alert("이 브라우저는 음성 인식을 지원하지 않습니다."); return; }
  LS.talk = on; stopMic();
  LS.step = 0; LS.said = null; LS.tries = 0;
  LS.steps = buildSteps(LS.queue[LS.i], LS.i+1, LS.queue.length);
  if (LS.playing){ try{TTS.cancel();}catch(e){} speakStep(); } else render();
}

/* 화면 전체를 다시 그리면 낭독이 끊기므로 필요한 부분만 갱신합니다. */
function paintListen(){
  if (view !== "listen") return;
  const el = document.getElementById("lsbody");
  if (el) el.innerHTML = listenBody();
}
function paintVoices(){
  if (view !== "listen") return;
  const el = document.getElementById("lsvoices");
  if (el) el.innerHTML = voiceChips();
}
function voiceChips(){
  const vs = koVoices();
  if (!vs.length) return `<div class="note" style="margin:0">기기에 한국어 음성이 없어 기본 음성으로 읽습니다.</div>`;
  const cur = LS.voice && LS.voice.name;
  return vs.map(v => `<button class="chip ${cur===v.name?"on":""}" onclick="setVoice(${JSON.stringify(v.name).replace(/"/g,"&quot;")})">${esc(v.name)}</button>`).join("");
}

function listenBody(){
  const q = LS.queue[LS.i], s = LS.steps[LS.step] || {};
  const phase = LS.done ? "완료"
    : LS.listening ? "듣고 있습니다 — 번호를 말하세요"
    : !LS.playing ? "일시정지"
    : s.think ? "생각할 시간" : s.ask ? "답할 차례" : s.answer ? "정답"
    : LS.step === 0 ? "시작" : LS.step === 1 ? "문제" : LS.step <= 5 ? "보기" : "해설";
  const pct = Math.round((LS.i + 1) / LS.queue.length * 100);
  const score = LS.talk && (LS.right + LS.wrong + LS.unsure)
    ? `<div class="lsscore">맞힘 ${LS.right} · 틀림 ${LS.wrong} · 모름 ${LS.unsure}</div>` : "";
  return `
    <div class="lsphase ${LS.listening?"mic":""}">${phase}</div>
    <div class="lspos">${LS.i + 1} / ${LS.queue.length}</div>
    ${score}
    <div class="progress" style="margin:14px 0 18px"><i style="width:${pct}%"></i></div>
    <button class="lsbig ${LS.listening?"mic":LS.playing?"on":""}" onclick="listenToggle()" aria-label="${LS.playing?"일시정지":"재생"}">
      ${LS.done ? "■" : LS.listening ? "🎙" : LS.playing ? "❚❚" : "▶"}
    </button>
    ${LS.heard ? `<div class="lsheard">들린 말: “${esc(LS.heard)}”</div>` : ""}
    <div class="lsrow">
      <button class="btn btn-ghost lsbtn" onclick="listenPrev()">◀ 이전</button>
      <button class="btn btn-ghost lsbtn" onclick="listenAgain()">↻ 다시</button>
      <button class="btn btn-ghost lsbtn" onclick="listenNext()">다음 ▶</button>
    </div>
    <div class="lsmeta">${q.s}과목 ${SUBJ[q.s]} · ${esc(q.t)} · 빈도 ${q.f}</div>
    <div class="lsq">${esc(q.q)}</div>`;
}

  return `<div class="row spread">

        : `문제와 보기를 읽고 잠시 멈춘 뒤 정답과 해설을 읽습니다. 학습 기록에는 반영되지 않습니다.`}
        ${SRec ? "" : "<br>이 브라우저는 음성 인식을 지원하지 않아 듣기만 가능합니다. Chrome 또는 Safari를 써 주세요."}

    </div>

      ${LS.skipped ? `코드·표·트리가 들어간 ${LS.skipped}문항은 귀로 들을 수 없어 제외했습니다.` : ""}
      iPhone·iPad는 화면을 잠그면 재생이 멈춥니다. 화면을 켠 채로 두시거나 자동 잠금 시간을 늘려 주세요.</div>

document.addEventListener("keydown", e => {
  if (view !== "listen") return;
  if (e.code === "Space"){ e.preventDefault(); listenToggle(); }
  else if (e.key === "ArrowRight") listenNext();
  else if (e.key === "ArrowLeft") listenPrev();
  else if (e.key.toLowerCase() === "r") listenAgain();
});

function render(){
  const app = document.getElementById("app");
  app.innerHTML = view === "quiz" ? viewQuiz() : view === "listen" ? viewListen()
                : view === "result" ? viewResult() : view === "stats" ? viewStats() : viewHome();
  window.scrollTo(0, view === "quiz" ? 0 : window.scrollY > 400 ? 0 : window.scrollY);
  if (view === "quiz" && sess.limitSec){ const el = document.getElementById("timer"); if (el) paintTimer(el, tickLeft()); }
}

function header(sub){
  return `<div class="top">
    <div><div class="brand">engineer information processing · written</div>
      <h1>정보처리기사 <em>필기 트레이너</em></h1></div>
    <div class="streak">🔥 ${streakDays()}일 연속 · 누적 ${totalSolved()}문항</div>

}

function viewHome(){
  const due = dueList().length, weak = weakList().length;
  const acc = totalSolved() ? Math.round(totalCorrect()/totalSolved()*100) : 0;

  const gauges = [1,2,3,4,5].map(s => {
    const m = subjMastery(s), C = 2*Math.PI*30, off = C*(1-m.pct/100);
    return `<div class="g"><div class="ring">
      <svg viewBox="0 0 70 70"><circle cx="35" cy="35" r="30" fill="none" stroke="#E3E8EE" stroke-width="7"/>
      <circle cx="35" cy="35" r="30" fill="none" stroke="var(--blue)" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
      <div class="val">${m.pct}</div></div>
      <div class="lbl"><b>${s}과목</b>${SUBJ[s]}</div></div>`;
  }).join("");

  // 히트맵 12주
  const cells = [];
  const end = new Date(); const start = new Date(); start.setDate(end.getDate() - 83);
  start.setDate(start.getDate() - start.getDay());
  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    const k = todayKey(d), n = DB.days[k] ? DB.days[k].solved : 0;
    const lv = n === 0 ? "" : n < 10 ? "l1" : n < 25 ? "l2" : n < 50 ? "l3" : "l4";
    cells.push(`<div class="hc ${lv}" title="${k} · ${n}문항"></div>`);
  }
  let heat = "";
  for (let i=0;i<cells.length;i+=7) heat += `<div class="hcol">${cells.slice(i,i+7).join("")}</div>`;

  return header() + `
  <div class="card"><h2>과목별 숙련도</h2><div class="gauges">${gauges}</div>
    <div class="note">각 문항의 복습 단계(1~5)를 과목 전체 문항 수로 나눈 비율입니다. 반복해서 맞힐수록 올라갑니다.</div></div>

  <div class="card"><h2>학습 흔적 · 최근 12주</h2><div class="heat">${heat}</div>
    <div class="heat-legend"><span>적음</span><span class="hc"></span><span class="hc l1"></span><span class="hc l2"></span><span class="hc l3"></span><span class="hc l4"></span><span>많음</span>
      <span style="margin-left:auto">누적 정답률 ${acc}% · 실력 ${totalSolved()?Math.round(totalSolid()/totalSolved()*100):0}%</span></div></div>

  <div class="card"><h2>학습 시작</h2>
    <div class="modes">
      <button class="mode" onclick="start('review')" ${due?"":"disabled"}>
        <div class="mt"><i class="dot d-teal"></i>오늘의 복습</div>
        <div class="md">${due ? due + "문항이 복습 예정일에 도달" : "오늘 복습할 문항 없음"}</div></button>
      <button class="mode" onclick="start('weak')" ${weak?"":"disabled"}>
        <div class="mt"><i class="dot d-mag"></i>약점 집중</div>
        <div class="md">${weak ? "틀렸거나 찍은 " + Math.min(weak,30) + "문항" : "아직 약점 없음"}</div></button>
      <button class="mode" onclick="start('study')">
        <div class="mt"><i class="dot d-blue"></i>과목 학습</div>
        <div class="md">즉시 채점 + 해설</div></button>
      <button class="mode" onclick="start('freq')">
        <div class="mt"><i class="dot d-amber"></i>고빈도 집중</div>
        <div class="md">출제 빈도 A등급만</div></button>
      <button class="mode" onclick="start('mock')">
        <div class="mt"><i class="dot d-blue"></i>실전 모의고사</div>
        <div class="md">100문항 · 150분 · 일괄 채점</div></button>
    </div>
  </div>

  <div class="card"><h2>눈 감고 학습</h2>
    <div class="modes">
      <button class="mode" onclick="listenStart('study', false)">
        <div class="mt"><i class="dot d-teal"></i>🎧 듣기만 · 과목</div>
        <div class="md">아래에서 고른 과목 · 기록 미반영</div></button>
      <button class="mode" onclick="listenStart('study', true)">
        <div class="mt"><i class="dot d-blue"></i>🎙 듣고 말하기 · 과목</div>
        <div class="md">마이크로 번호를 답함 · 기록 반영</div></button>
      <button class="mode" onclick="listenStart('freq', false)">
        <div class="mt"><i class="dot d-amber"></i>🎧 듣기만 · 고빈도</div>
        <div class="md">출제 빈도 A등급만</div></button>
      <button class="mode" onclick="listenStart('freq', true)">
        <div class="mt"><i class="dot d-amber"></i>🎙 듣고 말하기 · 고빈도</div>
        <div class="md">출제 빈도 A등급만</div></button>
      <button class="mode" onclick="listenStart('review', true)" ${due?"":"disabled"}>
        <div class="mt"><i class="dot d-teal"></i>🎙 듣고 말하기 · 복습</div>
        <div class="md">${due ? due + "문항" : "오늘 복습할 문항 없음"}</div></button>
      <button class="mode" onclick="listenStart('weak', true)" ${weak?"":"disabled"}>
        <div class="mt"><i class="dot d-mag"></i>🎙 듣고 말하기 · 약점</div>
        <div class="md">${weak ? "틀렸거나 찍은 " + Math.min(weak,30) + "문항" : "아직 약점 없음"}</div></button>
    </div>
    <div class="note"><b>듣기만</b>은 문제와 보기를 읽고 잠시 멈춘 뒤 정답과 해설을 읽습니다. 학습 기록은 건드리지 않습니다.
    <b>듣고 말하기</b>는 보기를 읽은 뒤 마이크가 켜져, "2번"처럼 말하면 채점하고 학습 기록에 반영합니다.
    시작한 뒤에도 화면에서 두 방식을 바로 바꿀 수 있습니다.
    코드·표·트리가 들어간 문항은 귀로 들어서는 알 수 없으므로 자동으로 제외됩니다.</div>
  </div>

  <div class="card"><h2>과목 선택 · 문항 수</h2>
    <div class="chips">${[1,2,3,4,5].map(s=>`<button class="chip ${pickSubj.includes(s)?"on":""}" onclick="toggleSubj(${s})">${s}과목 ${SUBJ[s]}<small>${BANK.filter(q=>q.s===s).length}</small></button>`).join("")}</div>
    <div class="chips" style="margin-top:10px">${[10,20,30,50].map(n=>`<button class="chip ${pickCount===n?"on":""}" onclick="setCount(${n})">${n}문항</button>`).join("")}</div>
    <div class="note">'과목 학습'과 '고빈도 집중'에 적용됩니다. 복습·약점·모의고사는 자동으로 범위가 정해집니다.</div>
  </div>

  <div class="row"><button class="btn btn-ghost" onclick="go('stats')">오답노트 · 통계 보기</button></div>`;
}

function viewQuiz(){
  const q = sess.queue[sess.i], sel = sess.ans[q.id], rev = sess.mode !== "mock" && sess.revealed;
  const st = DB.stats[q.id];
  const opts = q.o.map((orig,pos) => {
    let cls = "opt";
    if (rev){ cls += orig === q.a ? " ok" : (orig === sel ? " no" : " dis"); }
    else if (orig === sel) cls += " sel";
    return `<button class="${cls}" onclick="answer(${pos})"><span class="n">${"①②③④"[pos]}</span><span>${esc(q.c[orig])}</span></button>`;
  }).join("");

  const mk = sess.mark[q.id];
  const guessBtn = sess.mode === "mock"
    ? `<button class="btn ${mk==="guess"?"btn-mag":"btn-ghost"}" onclick="toggleGuess()">
         ${mk==="guess" ? "🎲 찍음으로 표시됨 (해제)" : "🎲 확신 없음 — 찍었다고 표시"}</button>`
    : (rev ? "" : `<button class="btn btn-ghost" onclick="unsure()">❓ 모르겠음 — 답과 해설 보기</button>`);

  let expl = "";
  if (rev){
    const ok = sel === q.a, s2 = DB.stats[q.id];
    const vd = mk === "unsure" ? "모르겠음 — 정답 " + "①②③④"[q.o.indexOf(q.a)]
             : mk === "guess" && ok ? "찍어서 맞힘 — 아직 아는 문제가 아닙니다"
             : ok ? "정답" : "오답 — 정답 " + "①②③④"[q.o.indexOf(q.a)];
    const solid = ok && !mk;
    expl = `<div class="expl ${solid?"":"bad"}">
      <div class="vd">${vd}</div>
      <p>${esc(q.e)}</p>
      <div class="srs">복습 단계 ${s2.box}/5 · 다음 복습 ${s2.due} · 확신 정답 ${s2.right}/${s2.seen}${s2.lucky?" · 찍어 맞힘 "+s2.lucky:""}${s2.unsure?" · 모르겠음 "+s2.unsure:""}</div>
      ${solid ? `<button class="btn btn-ghost" style="margin-top:10px;padding:7px 14px;font-size:12.5px" onclick="admitGuess()">사실 찍었습니다 — 다시 복습 대상으로</button>` : ""}
    </div>`;
  }

  return `<div class="row spread">
      <button class="btn btn-ghost" onclick="quit()">← 나가기</button>
      <div class="timer">${sess.label} · <span class="f">${sess.i+1}/${sess.queue.length}</span></div>
      ${sess.limitSec ? `<span id="timer" class="timer">--:--</span>` : `<span class="timer">${st ? "복습 " + st.box + "/5" : "첫 학습"}</span>`}
    </div>
    <div class="progress"><i style="width:${(sess.i+1)/sess.queue.length*100}%"></i></div>
    <div class="card">
      <div class="meta">
        <span class="tag">${q.s}과목 ${SUBJ[q.s]}</span>
        <span class="tag t2">${esc(q.t)}</span>
        <span class="tag ${q.f==="A"?"t3":"t4"}">빈도 ${q.f}</span>
        ${q.k && KMAP[q.k] ? `<span class="tag t4">${esc(KMAP[q.k][1])}</span>` : ""}
      </div>
      <div class="qtext${isMono(q.q)?" mono":""}">${esc(q.q)}</div>
      <div class="opts">${opts}</div>
      ${guessBtn ? `<div class="row" style="margin-top:12px">${guessBtn}</div>` : ""}
      ${expl}
    </div>
    <div class="sticky row spread">
      <button class="btn btn-ghost" onclick="prev()" ${sess.i?"":"disabled"}>이전</button>
      <button class="btn btn-primary" onclick="next()" ${sess.mode!=="mock"&&!sess.revealed?"disabled":""}>
        ${sess.i+1===sess.queue.length?"채점하기":"다음"}</button>
    </div>`;
}

function viewResult(){
  const qs = sess.queue;
  const right = qs.filter(q => sess.ans[q.id] === q.a);
  const solid = qs.filter(q => sess.ans[q.id] === q.a && !sess.mark[q.id]);
  const lucky = qs.filter(q => sess.ans[q.id] === q.a && sess.mark[q.id] === "guess");
  const wrong = qs.filter(q => sess.ans[q.id] !== q.a);
  const score = Math.round(right.length/qs.length*100);
  const real  = Math.round(solid.length/qs.length*100);
  const mins = Math.max(1, Math.round((Date.now()-sess.startedAt)/60000));

  const bySub = {};
  qs.forEach(q => { const b = bySub[q.s] || (bySub[q.s] = {t:0,c:0}); b.t++; if (sess.ans[q.id]===q.a) b.c++; });
  const fail = Object.entries(bySub).filter(([,v]) => v.c/v.t < 0.4).map(([s]) => s+"과목");

  const lines = Object.entries(bySub).map(([s,v]) => {
    const p = Math.round(v.c/v.t*100), col = p >= 60 ? "var(--teal)" : p >= 40 ? "var(--amber)" : "var(--mag)";
    return `<div class="sline"><span>${s}과목 ${SUBJ[s]}</span><span class="f" style="color:${col}">${v.c}/${v.t} · ${p}%</span></div>
      <div class="bar"><i style="width:${p}%;background:${col}"></i></div>`;
  }).join("");

  const review = wrong.concat(lucky);
  const revs = review.map(q => {
    const mk = sess.mark[q.id], sel = sess.ans[q.id];
    const badge = mk === "guess" ? `<span class="tag t3">찍어서 맞힘</span>`
                : mk === "unsure" ? `<span class="tag t3">모르겠음</span>` : "";
    let picked;
    if (mk === "unsure" || sel === -1 || sel === undefined) picked = `<div class="rw">답을 고르지 않음</div>`;
    else if (sel === q.a) picked = `<div class="rw">맞혔지만 확신이 없었습니다</div>`;
    else picked = `<div class="rw">선택 ${"①②③④"[q.o.indexOf(sel)]} ${esc(q.c[sel])}</div>`;
    return `<div class="rev">
      <div class="meta"><span class="tag">${q.s}과목</span><span class="tag t2">${esc(q.t)}</span>${badge}</div>
      <div class="rq${isMono(q.q)?" mono":""}">${esc(q.q)}</div>
      <div class="ra">정답 ${"①②③④"[q.o.indexOf(q.a)]} ${esc(q.c[q.a])}</div>
      ${picked}
      <div class="re">${esc(q.e)}</div></div>`;
  }).join("");

  return header() + `
  <div class="card">
    <div class="score"><b style="color:${score>=60?"var(--teal)":"var(--mag)"}">${score}</b>
      <span>점 · ${right.length}/${qs.length}문항 · ${mins}분<br>
      ${sess.mode==="mock" ? (score>=60 && !fail.length ? "합격 기준 충족" : fail.length ? "과락 위험: "+fail.join(", ")+" (40점 미만)" : "평균 60점 미만") : (score>=60?"기준선 통과":"기준선 미달")}</span></div>
    ${lucky.length ? `<div style="margin-top:14px;padding:12px 14px;border-radius:9px;background:var(--amber-soft);border-left:3px solid var(--amber)">
      <div style="font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--amber)">실력 점수 ${real}점</div>
      <div style="font-size:13.5px;margin-top:5px">확신 정답 ${solid.length} · 찍어서 맞힘 ${lucky.length} · 오답 ${wrong.length}<br>
      <span style="color:var(--ink2)">찍어서 맞힌 ${lucky.length}문항은 아직 아는 문제가 아닙니다. 복습 큐에 넣었습니다.</span></div></div>` : ""}
    ${lines}
  </div>
  ${review.length ? `<div class="card"><h2>다시 볼 문제 ${review.length}개 · 복습 큐에 등록됨</h2>${revs}</div>` : `<div class="card"><h2>완벽</h2><div class="empty">전부 확신을 갖고 맞혔습니다. 복습 간격이 늘어났습니다.</div></div>`}
  <div class="row">
    <button class="btn btn-primary" onclick="go('home')">대시보드</button>
    ${review.length ? `<button class="btn btn-mag" onclick="start('weak')">약한 문제 바로 복습</button>` : ""}
    <button class="btn btn-ghost" onclick="go('stats')">통계 보기</button>
  </div>`;
}

function viewStats(){
  const weak = weakList().slice(0,20);
  const rows = weak.map(q => { const s = DB.stats[q.id];
    const risky = (s.lucky||0) + (s.unsure||0);
    return `<tr><td><b>${q.s}과목</b> ${esc(q.t)}<br><span style="color:var(--ink2);font-size:12.5px">${esc(q.q.split("\n")[0]).slice(0,58)}…</span></td>
      <td class="num" style="color:var(--mag)">${s.wrong||0}</td>
      <td class="num" style="color:var(--amber)">${risky||"-"}</td>
      <td class="num">${Math.round(s.right/s.seen*100)}%</td><td class="num">${s.box}/5</td></tr>`;
  }).join("");
  const luckyTotal = BANK.reduce((n,q) => n + ((DB.stats[q.id]&&DB.stats[q.id].lucky)||0), 0);
  const unsureTotal = BANK.reduce((n,q) => n + ((DB.stats[q.id]&&DB.stats[q.id].unsure)||0), 0);

  const topics = {};
  BANK.forEach(q => { const s = DB.stats[q.id]; if (!s || !s.seen) return;
    const k = q.s + "|" + q.t; const t = topics[k] || (topics[k] = {seen:0,right:0,s:q.s,t:q.t});
    t.seen += s.seen; t.right += s.right; });
  const tr = Object.values(topics).filter(t=>t.seen>=2).sort((a,b)=>a.right/a.seen - b.right/b.seen).slice(0,10)
    .map(t => { const p = Math.round(t.right/t.seen*100);
      return `<tr><td><b>${t.s}과목</b> ${esc(t.t)}</td><td class="num">${t.right}/${t.seen}</td>
        <td style="width:34%"><div class="bar"><i style="width:${p}%;background:${p>=60?"var(--teal)":p>=40?"var(--amber)":"var(--mag)"}"></i></div></td></tr>`; }).join("");

  /* 출제기준 영역별 진단 — 공식 출제기준의 주요항목 단위로 학습 상태를 집계합니다.
     토픽은 앱이 정한 학습 단위지만, 이 표는 실제 시험 범위 그 자체를 기준으로 합니다. */
  const areas = {};
  BANK.forEach(q => {
    if (!q.k || !KMAP[q.k]) return;
    const key = q.s + "|" + KMAP[q.k][0];
    const a = areas[key] || (areas[key] = { s:q.s, name:KMAP[q.k][0], total:0, touched:0, seen:0, right:0 });
    a.total++;
    const st = DB.stats[q.id];
    if (st && st.seen){ a.touched++; a.seen += st.seen; a.right += st.right; }
  });
  const ar = Object.values(areas).sort((x,y) => x.s - y.s || y.total - x.total).map(a => {
    const cov = Math.round(a.touched / a.total * 100);
    const acc = a.seen ? Math.round(a.right / a.seen * 100) : null;
    const col = acc === null ? "var(--line)" : acc >= 60 ? "var(--teal)" : acc >= 40 ? "var(--amber)" : "var(--mag)";
    return `<tr><td><b>${a.s}과목</b> ${esc(a.name)}</td>
      <td class="num">${a.touched}/${a.total}</td>
      <td style="width:26%"><div class="bar"><i style="width:${cov}%;background:var(--blue)"></i></div></td>
      <td class="num" style="color:${col}">${acc === null ? "–" : acc + "%"}</td></tr>`;
  }).join("");
  const untouched = Object.values(areas).filter(a => a.touched === 0);

  const hist = DB.sessions.slice(0,12).map(s =>
    `<tr><td>${s.date}</td><td>${esc(s.mode)}</td><td class="num">${s.correct}/${s.total}</td>
     <td class="num">${Math.round(s.correct/s.total*100)}%</td>
     <td class="num" style="color:var(--teal)">${s.solid!==undefined?Math.round(s.solid/s.total*100)+"%":"-"}</td></tr>`).join("");

  return header() + `
  <div class="card"><h2>약한 문제 TOP 20</h2>
    ${weak.length ? `<table><tr><th>문항</th><th style="text-align:right">오답</th><th style="text-align:right">찍음·모름</th><th style="text-align:right">확신 정답률</th><th style="text-align:right">단계</th></tr>${rows}</table>
      <div class="note">확신 정답률은 찍어서 맞힌 것을 제외한 실제 실력 지표입니다.
      ${luckyTotal||unsureTotal ? `지금까지 찍어서 맞힌 ${luckyTotal}회, 모르겠다고 표시한 ${unsureTotal}회가 복습 대상으로 잡혀 있습니다.` : ""}</div>`
      : `<div class="empty">아직 데이터가 없습니다. 학습을 시작하면 여기에 쌓입니다.</div>`}
  </div>

  <div class="card"><h2>약한 토픽</h2>
    ${tr ? `<table>${tr}</table>` : `<div class="empty">같은 토픽을 2회 이상 풀면 표시됩니다.</div>`}
  </div>

  <div class="card"><h2>출제기준 영역별 진단</h2>
    <table><tr><th>주요항목</th><th style="text-align:right">진도</th><th>커버리지</th><th style="text-align:right">정답률</th></tr>${ar}</table>
    <div class="note">공식 출제기준(Q-Net)의 주요항목 단위입니다. '진도'는 해당 영역에서 한 번이라도 푼 문항 수,
    '정답률'은 그중 확신을 갖고 맞힌 비율입니다.
    ${untouched.length ? `아직 손대지 않은 영역이 ${untouched.length}개 있습니다 — ${untouched.slice(0,3).map(a=>a.s+"과목 "+esc(a.name)).join(", ")}${untouched.length>3?" 외":""}.` : "모든 영역을 한 번 이상 학습했습니다."}</div>
  </div>

  <div class="card"><h2>최근 학습 기록</h2>
    ${hist ? `<table><tr><th>날짜</th><th>모드</th><th style="text-align:right">점수</th><th style="text-align:right">정답률</th><th style="text-align:right">실력</th></tr>${hist}</table>
      <div class="note">'실력'은 찍지 않고 확신을 갖고 맞힌 비율입니다. 두 값의 차이가 크면 아직 이해가 얕다는 뜻입니다.</div>`
      : `<div class="empty">기록 없음</div>`}
  </div>

  <div class="card"><h2>기기 간 이동 · 백업</h2>
    <div class="note" style="margin-top:0">학습 기록은 이 브라우저에만 저장됩니다. 다른 기기에서 이어서 하려면 아래 코드를 복사해 옮긴 뒤 붙여넣고 [불러오기]를 누르세요.</div>
    <textarea id="bk" placeholder="여기에 백업 코드를 붙여넣으세요"></textarea>
    <div class="row" style="margin-top:9px">
      <button class="btn btn-ghost" onclick="doExport()">현재 기록 내보내기</button>
      <button class="btn btn-primary" onclick="doImport()">불러오기</button>
      <button class="btn btn-mag" onclick="doReset()">전체 초기화</button>
    </div>
    <div class="note" id="bkmsg">저장 방식: ${Store.kind === "local" ? "브라우저 localStorage (영구)" : "임시 저장 — 이 화면을 닫으면 사라집니다"}</div>
  </div>

  <div class="row"><button class="btn btn-ghost" onclick="go('home')">← 대시보드</button></div>`;
}

/* ═══════════════ 액션 ═══════════════ */
function go(v){ view = v; render(); }
function quit(){ clearInterval(tick); sess = null; go("home"); }
function prev(){ if (sess.i){ sess.i--; sess.revealed = sess.mode !== "mock" && sess.ans[sess.queue[sess.i].id] !== undefined; render(); } }
function toggleSubj(s){ pickSubj = pickSubj.includes(s) ? pickSubj.filter(x=>x!==s) : pickSubj.concat(s); if(!pickSubj.length) pickSubj=[s]; render(); }
function setCount(n){ pickCount = n; render(); }
function doExport(){ document.getElementById("bk").value = btoa(unescape(encodeURIComponent(JSON.stringify(DB)))); document.getElementById("bkmsg").textContent = "내보내기 완료 — 위 코드를 전체 복사하세요."; }
function doImport(){
  const v = document.getElementById("bk").value.trim(); if (!v) return;
  try { const d = JSON.parse(decodeURIComponent(escape(atob(v))));
    if (!d.stats || !d.days) throw 0;
    DB = d; save(); document.getElementById("bkmsg").textContent = "불러오기 완료."; render();
  } catch(e){ document.getElementById("bkmsg").textContent = "코드를 읽을 수 없습니다. 전체를 정확히 붙여넣었는지 확인하세요."; }
}
function doReset(){ if (confirm("모든 학습 기록이 삭제됩니다. 계속할까요?")){ DB = {v:1,stats:{},days:{},sessions:[]}; save(); go("home"); } }

/* ═══════════════ 오프라인(PWA) ═══════════════ */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ═══════════════ 시작 ═══════════════ */
(async () => {
  const d = await Store.load();
  if (d && d.stats) DB = Object.assign({v:1,stats:{},days:{},sessions:[]}, d);
  render();
})();
</script>
</body>
</html>
